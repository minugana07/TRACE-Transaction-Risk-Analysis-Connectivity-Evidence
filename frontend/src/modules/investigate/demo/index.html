<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRACE | Investigate, Risk Ripple & Hotspot Map (Member 4)</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #060911;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .demo-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .demo-header {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .demo-header h2 {
      margin: 0;
      font-size: 18px;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .demo-badge {
      background: #0284c7;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .demo-tag {
      background: #1e293b;
      color: #94a3b8;

<body>
  <div class="demo-container">
    <div class="demo-header">
      <h2>
        <span class="demo-badge">TRACE</span>

      </h2>

    <div id="investigate-root"></div>
  </div>

  <script type="module">
    import { mountTraceInvestigate } from './index.ts';

    const root = document.getElementById('investigate-root');
    mountTraceInvestigate(root, { useSyntheticDemo: true })
      .then((moduleInstance) => {
        console.log('TRACE Investigate Module mounted successfully.', moduleInstance);
      })
      .catch((err) => {
        console.error('Failed mounting TRACE Investigate Module:', err);
      });
  </script>
